<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MedFlowAI — heart and stroke risk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap" rel="stylesheet" />
<style>
/* MedFlowAI — monitor shell, paper chart.
   Signal colours (green/amber/red) are reserved for risk tiers only. */

:root {
  --shell-0: #08111b;
  --shell-1: #0f2233;
  --shell-line: rgba(255, 255, 255, 0.10);
  --shell-ink: #cfe0ee;
  --shell-ink-dim: #7e97ab;

  --paper: #ffffff;
  --paper-2: #f2f6fa;
  --ink: #0d1a26;
  --ink-2: #47596b;
  --ink-3: #7a8b9b;
  --line: #dde5ed;

  --brand: #123a57;
  --brand-hi: #1b5480;
  --pulse: #4fd6b0;
  --heart: #e05266;
  --stroke: #6f7ee0;

  --low: #2e9e7e;
  --moderate: #d89a2b;
  --high: #e05266;

  --r-card: 20px;
  --r-ctl: 12px;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; }

html, body, #root { height: 100%; }

body {
  margin: 0;
  color-scheme: dark;
  background: var(--shell-0);
  color: var(--shell-ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

button, input, select { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--pulse);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ---------------- shell ---------------- */

.shell {
  min-height: 100%;
  background:
    radial-gradient(1100px 620px at 50% -10%, var(--shell-1) 0%, var(--shell-0) 62%);
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px clamp(16px, 5vw, 40px);
  border-bottom: 1px solid var(--shell-line);
}

.wordmark {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: #fff;
}

.wordmark svg { display: block; }

.badge {
  font-size: 12px;
  padding: 4px 10px;
  border: 1px solid var(--shell-line);
  border-radius: 999px;
  color: var(--shell-ink-dim);
  white-space: nowrap;
}

.badge[data-live="true"] { color: var(--pulse); border-color: rgba(79, 214, 176, 0.4); }

.stage {
  flex: 1;
  display: flex;
  justify-content: center;
  padding: clamp(20px, 5vw, 56px) clamp(16px, 5vw, 40px) 64px;
}

.col {
  width: 100%;
  max-width: 660px;
}

.col.wide { max-width: 860px; }

/* ---------------- landing ---------------- */

.hero-trace {
  width: 100%;
  height: 92px;
  display: block;
  margin-bottom: 28px;
}

.hero-trace path {
  fill: none;
  stroke: var(--pulse);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1400;
  stroke-dashoffset: 1400;
  animation: trace 2.6s cubic-bezier(0.3, 0, 0.2, 1) forwards;
}

@keyframes trace { to { stroke-dashoffset: 0; } }

h1 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(34px, 6vw, 54px);
  line-height: 1.08;
  letter-spacing: -0.015em;
  color: #fff;
  margin: 0 0 18px;
}

.lede {
  font-size: 17px;
  line-height: 1.6;
  color: var(--shell-ink-dim);
  max-width: 54ch;
  margin: 0 0 32px;
}

.facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px;
  background: var(--shell-line);
  border: 1px solid var(--shell-line);
  border-radius: 14px;
  overflow: hidden;
  margin: 36px 0 0;
}

.fact { background: rgba(255, 255, 255, 0.02); padding: 16px 18px; }
.fact b { display: block; font-size: 22px; font-weight: 500; color: #fff; }
.fact span { font-size: 13px; color: var(--shell-ink-dim); }

.disclaimer {
  margin-top: 28px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--shell-ink-dim);
  border-left: 2px solid var(--shell-line);
  padding-left: 14px;
  max-width: 56ch;
}

/* ---------------- card ---------------- */

.card {
  background: var(--paper);
  color: var(--ink);
  border-radius: var(--r-card);
  padding: clamp(22px, 4vw, 38px);
  box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.8);
}

.rail {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 26px;
}

.rail-track {
  flex: 1;
  height: 3px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
}

.rail-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 320ms cubic-bezier(0.3, 0, 0.2, 1), background-color 320ms;
}

.rail-meta {
  font-size: 13px;
  color: var(--ink-3);
  white-space: nowrap;
}

.section-tag {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 14px;
}

.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

.prompt {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(24px, 4vw, 33px);
  line-height: 1.2;
  letter-spacing: -0.01em;
  margin: 0 0 10px;
  color: var(--ink);
}

.help {
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink-3);
  margin: 0 0 24px;
  max-width: 52ch;
}

/* ---------------- inputs ---------------- */

.opts { display: grid; gap: 9px; }

.opt {
  display: flex;
  align-items: baseline;
  gap: 12px;
  text-align: left;
  width: 100%;
  padding: 14px 16px;
  background: var(--paper-2);
  border: 1px solid transparent;
  border-radius: var(--r-ctl);
  cursor: pointer;
  transition: background-color 120ms, border-color 120ms;
}

.opt:hover { background: #e8eff6; }

.opt[aria-pressed="true"] {
  background: #fff;
  border-color: var(--brand);
  box-shadow: inset 0 0 0 1px var(--brand);
}

.opt-key {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-3);
  min-width: 14px;
}

.opt[aria-pressed="true"] .opt-key { color: var(--brand); }
.opt-label { font-weight: 500; }
.opt-note { display: block; font-size: 13px; color: var(--ink-3); font-weight: 400; margin-top: 2px; }

.numwrap {
  display: flex;
  align-items: baseline;
  gap: 10px;
  border-bottom: 2px solid var(--line);
  padding-bottom: 8px;
  max-width: 320px;
  transition: border-color 140ms;
}

.numwrap:focus-within { border-color: var(--brand); }

.numwrap input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  font-family: var(--serif);
  font-size: 40px;
  padding: 0;
  color: var(--ink);
}

.numwrap input:focus { outline: none; }
.numwrap input::-webkit-outer-spin-button,
.numwrap input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.numwrap input[type="number"] { -moz-appearance: textfield; }
.numwrap span { font-size: 15px; color: var(--ink-3); }

select.field {
  width: 100%;
  max-width: 420px;
  padding: 14px 16px;
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: var(--r-ctl);
  cursor: pointer;
}

.field-error { color: var(--high); font-size: 13px; margin-top: 10px; }

/* ---------------- buttons ---------------- */

.actions { display: flex; align-items: center; gap: 12px; margin-top: 30px; flex-wrap: wrap; }

.btn {
  padding: 13px 24px;
  border-radius: var(--r-ctl);
  border: 1px solid transparent;
  background: var(--brand);
  color: #fff;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 130ms, transform 130ms;
}

.btn:hover { background: var(--brand-hi); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }

.btn.ghost { background: none; color: var(--ink-2); border-color: var(--line); }
.btn.ghost:hover { background: var(--paper-2); color: var(--ink); }

.btn.on-shell { background: var(--pulse); color: #06202a; }
.btn.on-shell:hover { background: #6ce4c3; }
.btn.ghost.on-shell { background: none; color: var(--shell-ink); border-color: var(--shell-line); }
.btn.ghost.on-shell:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }

.hint { font-size: 13px; color: var(--ink-3); }

/* ---------------- loading ---------------- */

.loading { text-align: center; padding: 70px 0; }

.loading h2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 28px;
  color: #fff;
  margin: 26px 0 8px;
}

.loading p { color: var(--shell-ink-dim); font-size: 15px; margin: 0; }

.ekg { width: 220px; height: 60px; }
.ekg path {
  fill: none; stroke: var(--pulse); stroke-width: 2.5;
  stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 90 460;
  animation: sweep 1.5s linear infinite;
}

@keyframes sweep { from { stroke-dashoffset: 550; } to { stroke-dashoffset: 0; } }

/* ---------------- results ---------------- */

.result-head { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }

.tier-mark {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 999px;
  color: #fff;
}

.result-head h2 {
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(26px, 4.4vw, 36px); line-height: 1.15;
  margin: 0; flex: 1; min-width: 240px; letter-spacing: -0.01em;
}

.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }

.score {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
}

.score-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.score-name { font-weight: 600; font-size: 15px; }
.score-tier { font-size: 13px; font-weight: 500; }

.score-num {
  font-family: var(--serif);
  font-size: 46px;
  line-height: 1.05;
  margin: 10px 0 14px;
  letter-spacing: -0.02em;
}

.meter { height: 6px; background: var(--paper-2); border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; transition: width 700ms cubic-bezier(0.3, 0, 0.2, 1); }

.drivers { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 9px; }
.drivers li { font-size: 14px; line-height: 1.5; color: var(--ink-2); padding-left: 16px; position: relative; }
.drivers li::before {
  content: ""; position: absolute; left: 0; top: 8px;
  width: 6px; height: 6px; border-radius: 50%; background: var(--line);
}

.steps { margin-top: 30px; border-top: 1px solid var(--line); padding-top: 24px; }
.steps h3 { font-family: var(--serif); font-weight: 400; font-size: 24px; margin: 0 0 16px; }
.steps ol { margin: 0; padding-left: 20px; display: grid; gap: 11px; }
.steps li { font-size: 15px; line-height: 1.55; color: var(--ink-2); }
.steps li::marker { color: var(--ink-3); font-size: 13px; }

.payload {
  margin-top: 26px;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}

.payload summary {
  cursor: pointer; padding: 12px 16px; font-size: 14px;
  color: var(--ink-2); background: var(--paper-2);
}

.payload pre {
  margin: 0; padding: 16px; overflow-x: auto;
  font-family: var(--mono); font-size: 12px; line-height: 1.7; color: var(--ink-2);
  background: #fff;
}

/* ---------------- counterfactual ---------------- */

.lever-pick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; }

.chip {
  padding: 9px 15px; border-radius: 999px;
  border: 1px solid var(--line); background: #fff;
  font-size: 14px; cursor: pointer; color: var(--ink-2);
  transition: background-color 120ms, color 120ms, border-color 120ms;
}

.chip:hover { border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }

.slider-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.slider-val { font-family: var(--serif); font-size: 34px; letter-spacing: -0.01em; }
.slider-val span { font-family: var(--sans); font-size: 14px; color: var(--ink-3); margin-left: 6px; }

input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 26px; background: none; cursor: pointer; margin: 0;
}

input[type="range"]::-webkit-slider-runnable-track {
  height: 5px; border-radius: 999px; background: var(--line);
}

input[type="range"]::-moz-range-track { height: 5px; border-radius: 999px; background: var(--line); }

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 24px; height: 24px; margin-top: -10px;
  border-radius: 50%; background: var(--brand);
  border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
}

input[type="range"]::-moz-range-thumb {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--brand); border: 3px solid #fff;
}

.cf-compare {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  gap: 16px; margin-top: 30px; padding: 24px;
  border: 1px solid var(--line); border-radius: 16px; background: var(--paper-2);
}

.cf-side { text-align: center; }
.cf-side small { display: block; font-size: 13px; color: var(--ink-3); margin-bottom: 6px; }
.cf-side b { font-family: var(--serif); font-weight: 400; font-size: 38px; letter-spacing: -0.02em; }

.cf-arrow { color: var(--ink-3); font-size: 20px; }

.cf-delta { margin-top: 18px; font-size: 15px; line-height: 1.55; text-align: center; color: var(--ink-2); }
.cf-delta b { font-weight: 600; }

.mock-note {
  margin-top: 22px; font-size: 13px; color: var(--ink-3);
  border-top: 1px solid var(--line); padding-top: 14px;
}

.err {
  background: #fdeaec; border: 1px solid #f5c2c8; color: #8c1f2c;
  padding: 14px 16px; border-radius: var(--r-ctl); font-size: 14px; margin-bottom: 20px;
}

@media (max-width: 560px) {
  .cf-compare { grid-template-columns: 1fr; }
  .cf-arrow { transform: rotate(90deg); }
}

/* ---------------- login ---------------- */

.login-shell {
  min-height: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--shell-0);
}

@media (max-width: 720px) {
  .login-shell { grid-template-columns: 1fr; }
  .login-panel { display: none; }
}

.login-panel {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(900px 700px at 30% 60%, rgba(79,214,176,0.12) 0%, transparent 65%),
    radial-gradient(600px 500px at 70% 20%, rgba(111,126,224,0.12) 0%, transparent 65%),
    var(--shell-1);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 48px;
}

.login-panel-trace {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
}

.login-panel-trace path {
  fill: none;
  stroke: var(--pulse);
  stroke-width: 1.5;
  opacity: 0.25;
  stroke-dasharray: 2000;
  stroke-dashoffset: 2000;
  animation: trace 3.5s cubic-bezier(0.3, 0, 0.2, 1) forwards;
}

.login-panel blockquote {
  position: relative;
  margin: 0;
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(22px, 3vw, 30px);
  line-height: 1.25;
  color: #fff;
  letter-spacing: -0.01em;
}

.login-panel cite {
  display: block;
  margin-top: 16px;
  font-style: normal;
  font-size: 14px;
  color: var(--shell-ink-dim);
}

.login-form-side {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(32px, 6vw, 72px);
}

.login-form-side .wordmark { margin-bottom: 40px; }

.login-form-side h2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(26px, 3.5vw, 36px);
  letter-spacing: -0.01em;
  color: #fff;
  margin: 0 0 8px;
}

.login-form-side .sub {
  font-size: 15px;
  color: var(--shell-ink-dim);
  margin: 0 0 36px;
}

.login-fields { display: grid; gap: 16px; }

.field-wrap { display: grid; gap: 6px; }

.field-wrap label {
  font-size: 13px;
  font-weight: 500;
  color: var(--shell-ink-dim);
  letter-spacing: 0.01em;
}

.field-wrap input {
  width: 100%;
  padding: 13px 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--shell-line);
  border-radius: var(--r-ctl);
  color: #fff;
  font-size: 15px;
  transition: border-color 140ms, background-color 140ms;
}

.field-wrap input::placeholder { color: var(--shell-ink-dim); opacity: 0.6; }
.field-wrap input:focus {
  outline: none;
  border-color: var(--pulse);
  background: rgba(255,255,255,0.08);
}

.field-wrap input[aria-invalid="true"] { border-color: var(--high); }

.login-err {
  padding: 12px 14px;
  background: rgba(224,82,102,0.12);
  border: 1px solid rgba(224,82,102,0.35);
  border-radius: var(--r-ctl);
  color: #f08090;
  font-size: 14px;
}

.btn.login-btn {
  width: 100%;
  padding: 15px;
  margin-top: 8px;
  background: var(--pulse);
  color: #06202a;
  font-size: 15px;
  font-weight: 600;
  border-radius: var(--r-ctl);
  border: none;
}

.btn.login-btn:hover { background: #6ce4c3; }
.btn.login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.login-footer {
  margin-top: 28px;
  font-size: 13px;
  color: var(--shell-ink-dim);
  line-height: 1.6;
}

.login-footer a {
  color: var(--pulse);
  text-decoration: none;
}

.login-footer a:hover { text-decoration: underline; }

.login-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
  color: var(--shell-ink-dim);
  font-size: 13px;
}

.login-divider::before,
.login-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--shell-line);
}

.btn.btn-guest {
  width: 100%;
  padding: 13px;
  background: transparent;
  border: 1px solid var(--shell-line);
  color: var(--shell-ink);
  border-radius: var(--r-ctl);
  font-size: 14px;
  cursor: pointer;
  transition: background-color 130ms, border-color 130ms;
}

.btn.btn-guest:hover {
  background: rgba(255,255,255,0.05);
  border-color: rgba(255,255,255,0.2);
  color: #fff;
}

.topbar-user {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--brand-hi);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; color: #fff;
  border: 1px solid var(--shell-line);
  flex-shrink: 0;
}

.btn.btn-signout {
  font-size: 13px;
  padding: 6px 12px;
  background: transparent;
  border: 1px solid var(--shell-line);
  color: var(--shell-ink-dim);
  border-radius: 8px;
  cursor: pointer;
  transition: border-color 120ms, color 120ms;
}

.btn.btn-signout:hover { border-color: rgba(255,255,255,0.2); color: #fff; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .hero-trace path { stroke-dashoffset: 0; }
}

</style>
</head>
<body>
<div id="root"></div>
<script>window.MEDFLOW_API_BASE = "http://localhost:8080";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ===== lib/encoder.js ===== */

/* ------------------------------------------------------------------
   encoder.js — THE ONLY place answers become model features.
   Nothing else in the app is allowed to build a feature object.

   Output: 27 keys. Heart model reads its 13 by name, stroke model
   reads its 15 by name (age is shared), the C++ server picks each
   model's slice via feature_names order. Every value is a Number.
   ------------------------------------------------------------------ */

/* Category -> one-hot flag name. "other" buckets map to null, which
   means every flag in that group stays 0. */
const WORK_TYPE_FLAGS = {
  never_worked: 'work_type_Never_worked',
  private: 'work_type_Private',
  self_employed: 'work_type_Self-employed',
  children: 'work_type_children',
  govt_other: null, // Govt-or-other -> all four flags 0
};

const SMOKING_FLAGS = {
  formerly: 'smoking_status_formerly smoked',
  never: 'smoking_status_never smoked',
  smokes: 'smoking_status_smokes',
  unknown: null, // Unknown -> all three flags 0
};

const ALL_ONE_HOT = [
  ...Object.values(WORK_TYPE_FLAGS),
  ...Object.values(SMOKING_FLAGS),
].filter(Boolean);

/* Sex is asked once and fed to both models: heart calls it `sex`,
   stroke calls it `gender`. Same 1 = male / 0 = female encoding.
   Set SHARE_SEX to false if you'd rather ask the two separately. */
const SHARE_SEX = true;

const int = (v, fallback = 0) => {
  const n = Number(v);
  return Number.isFinite(n) ? Math.round(n) : fallback;
};

const num = (v, fallback = 0) => {
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
};

const bin = (v) => (v === true || v === 1 || v === '1' || v === 'yes' ? 1 : 0);

function oneHot(group, choice) {
  const out = {};
  for (const flag of Object.values(group)) if (flag) out[flag] = 0;
  const hit = group[choice];
  if (hit) out[hit] = 1;
  return out;
}

/**
 * @param {Object} a  raw answers keyed by question id
 * @returns {Object}  feature object ready for POST { features }
 */
function encodeFeatures(a = {}) {
  const age = int(a.age, 0);
  const sex = bin(a.sex);

  const features = {
    /* ---- heart model: 13 ---- */
    age,
    sex,
    cp: int(a.cp),
    trestbps: int(a.trestbps),
    chol: int(a.chol),
    fbs: bin(a.fbs),
    restecg: int(a.restecg),
    thalach: int(a.thalach),
    exang: bin(a.exang),
    oldpeak: num(a.oldpeak), // float — ST depression
    slope: int(a.slope),
    ca: int(a.ca),
    thal: int(a.thal),

    /* ---- stroke model: 15 (age reused from above) ---- */
    gender: SHARE_SEX ? sex : bin(a.gender),
    hypertension: bin(a.hypertension),
    heart_disease: bin(a.heart_disease),
    ever_married: bin(a.ever_married),
    Residence_type: bin(a.Residence_type), // 1 = Urban, 0 = Rural
    avg_glucose_level: num(a.avg_glucose_level), // float
    bmi: num(a.bmi), // float
    ...oneHot(WORK_TYPE_FLAGS, a.work_type),
    ...oneHot(SMOKING_FLAGS, a.smoking_status),
  };

  return features;
}

/* Dev guard — throws loudly on the failure modes the backend can't
   recover from: strings, booleans, NaN, or a broken one-hot group. */
function assertValidFeatures(f) {
  const bad = [];
  for (const [k, v] of Object.entries(f)) {
    if (typeof v !== 'number' || !Number.isFinite(v)) bad.push(`${k}=${JSON.stringify(v)}`);
  }
  for (const group of [WORK_TYPE_FLAGS, SMOKING_FLAGS]) {
    const flags = Object.values(group).filter(Boolean);
    const sum = flags.reduce((s, k) => s + (f[k] || 0), 0);
    if (sum > 1) bad.push(`one-hot group has ${sum} flags set: ${flags.join(', ')}`);
  }
  for (const k of ALL_ONE_HOT) {
    if (f[k] !== 0 && f[k] !== 1) bad.push(`${k} must be 0 or 1`);
  }
  if (bad.length) throw new Error('Invalid feature payload: ' + bad.join(' | '));
  return f;
}

/* ===== lib/risk.js ===== */

/* risk.js — turns probabilities and features into something a person
   can read. The server returns bare probabilities, so the wording,
   tiering and next steps are decided here. */

const TIERS = {
  low: { key: 'low', label: 'Low', color: '#2E9E7E' },
  moderate: { key: 'moderate', label: 'Moderate', color: '#D89A2B' },
  high: { key: 'high', label: 'High', color: '#E05266' },
};

function tierFor(p) {
  if (p < 0.33) return TIERS.low;
  if (p < 0.66) return TIERS.moderate;
  return TIERS.high;
}

function overallTier(heart, stroke) {
  return tierFor(Math.max(heart, stroke));
}

const pct = (p) => `${(p * 100).toFixed(1)}%`;

  { test: (f) => f.thal === 3, weight: 3, text: () => 'Your scan showed a reversible defect' },
  { test: (f) => f.exang === 1, weight: 3, text: () => 'Exercise brings on chest pain' },
  { test: (f) => f.oldpeak >= 1.5, weight: 2, text: (f) => `ST depression of ${f.oldpeak} mm during exertion` },
  { test: (f) => f.cp === 0, weight: 2, text: () => 'Your chest pain follows the typical angina pattern' },
  { test: (f) => f.chol >= 240, weight: 2, text: (f) => `Cholesterol of ${f.chol} mg/dl is above the 240 threshold` },
  { test: (f) => f.trestbps >= 140, weight: 2, text: (f) => `Resting blood pressure of ${f.trestbps} mm Hg is in the hypertensive range` },
  { test: (f) => f.thalach < 120, weight: 2, text: (f) => `Peak heart rate of ${f.thalach} bpm is lower than expected for your age` },
  { test: (f) => f.slope === 2, weight: 1, text: () => 'A downsloping ST segment at peak exercise' },
  { test: (f) => f.age >= 60, weight: 1, text: (f) => `Age ${f.age}` },
];

const STROKE_DRIVERS = [
  { test: (f) => f.hypertension === 1, weight: 3, text: () => 'A hypertension diagnosis' },
  { test: (f) => f.heart_disease === 1, weight: 3, text: () => 'An existing heart disease diagnosis' },
  { test: (f) => f.avg_glucose_level >= 140, weight: 3, text: (f) => `Average glucose of ${f.avg_glucose_level} mg/dl sits in the diabetic range` },
  { test: (f) => f['smoking_status_smokes'] === 1, weight: 3, text: () => 'Currently smoking' },
  { test: (f) => f.bmi >= 30, weight: 2, text: (f) => `BMI of ${f.bmi} is in the obese range` },
  { test: (f) => f['smoking_status_formerly smoked'] === 1, weight: 1, text: () => 'A history of smoking' },
  { test: (f) => f.age >= 60, weight: 2, text: (f) => `Age ${f.age}` },
];

function collect(list, f, limit = 3) {
  return list
    .filter((d) => d.test(f))
    .sort((a, b) => b.weight - a.weight)
    .slice(0, limit)
    .map((d) => d.text(f));
}

function explain(features, heartRisk, strokeRisk) {
  const heart = collect(HEART_DRIVERS, features);
  const stroke = collect(STROKE_DRIVERS, features);
  return {
    heart: {
      risk: heartRisk,
      tier: tierFor(heartRisk),
      drivers: heart.length ? heart : ['Nothing in your answers stood out as a cardiac risk factor.'],
    },
    stroke: {
      risk: strokeRisk,
      tier: tierFor(strokeRisk),
      drivers: stroke.length ? stroke : ['Nothing in your answers stood out as a stroke risk factor.'],
    },
  };
}

function nextSteps(features, heartRisk, strokeRisk) {
  const top = Math.max(heartRisk, strokeRisk);
  const steps = [];

  if (top >= 0.66) {
    steps.push('Book an appointment with a doctor this week and bring these answers with you.');
  } else if (top >= 0.33) {
    steps.push('Raise this at your next routine check-up rather than waiting for symptoms.');
  } else {
    steps.push('Keep to your usual check-up schedule — nothing here calls for an urgent visit.');
  }

  if (features.trestbps >= 140 || features.hypertension === 1)
    steps.push('Track your blood pressure at home for two weeks and note the readings.');
  if (features.chol >= 240) steps.push('Ask for a repeat lipid panel and discuss whether statins fit your case.');
  if (features.avg_glucose_level >= 140) steps.push('Request an HbA1c test to confirm where your glucose sits over time.');
  if (features['smoking_status_smokes'] === 1)
    steps.push('Stopping smoking moves both numbers more than anything else on this list.');
  if (features.bmi >= 30) steps.push('A 5% drop in weight measurably shifts the stroke estimate.');
  if (features.exang === 1)
    steps.push('Chest pain during exercise is worth mentioning to a clinician directly, not just noting.');

  steps.push('Try the sliders on the next screen to see which single change moves your risk most.');
  return steps;
}

/* ===== lib/api.js ===== */

/* api.js — talks to the C++ inference server.
     POST /predict          { features }                                   -> { heart_risk, stroke_risk }
     POST /counterfactual   { features, model, flip_field, flip_value }    -> { original_risk, new_risk, delta }

   If the server is unreachable the app keeps working on MOCK responses
   that match those shapes exactly, so the UI can be demoed before the
   backend is up. `source` on the result says which one you got. */

const API_BASE =
  (typeof window !== 'undefined' && window.MEDFLOW_API_BASE) || 'http://localhost:8080';

const REQUEST_TIMEOUT_MS = 6000;

async function post(path, body) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), REQUEST_TIMEOUT_MS);
  try {
    const res = await fetch(API_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctl.signal,
    });
    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(`Server sent a non-JSON reply (HTTP ${res.status}).`);
    }
    if (!res.ok) throw new Error(data.error || `Server returned HTTP ${res.status}.`);
    return data;
  } finally {
    clearTimeout(timer);
  }
}

/* ---------------- mock inference ---------------- */
/* A small logistic stand-in so sliders move sensibly without a backend.
   Not the real model — never ship this as a prediction. */
const sigmoid = (z) => 1 / (1 + Math.exp(-z));

function mockPredict(f) {
  const heartZ =
    -6.4 +
    0.045 * (f.age - 50) +
    0.55 * f.sex +
    0.42 * (3 - f.cp) +
    0.016 * (f.trestbps - 120) +
    0.006 * (f.chol - 200) +
    0.3 * f.fbs +
    0.25 * f.restecg -
    0.026 * (f.thalach - 150) +
    0.75 * f.exang +
    0.6 * f.oldpeak +
    0.4 * f.slope +
    0.55 * f.ca +
    0.35 * (f.thal === 3 ? 1.6 : f.thal === 2 ? 0.8 : 0);

  const strokeZ =
    -7.1 +
    0.072 * (f.age - 45) +
    0.85 * f.hypertension +
    0.9 * f.heart_disease +
    0.012 * (f.avg_glucose_level - 100) +
    0.035 * (f.bmi - 25) +
    0.3 * f.ever_married +
    0.6 * f['smoking_status_smokes'] +
    0.35 * f['smoking_status_formerly smoked'] +
    0.15 * f.Residence_type +
    0.2 * f['work_type_Self-employed'];

  return {
    heart_risk: Number(sigmoid(heartZ).toFixed(4)),
    stroke_risk: Number(sigmoid(strokeZ).toFixed(4)),
  };
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------------- public calls ---------------- */

async function predict(features) {
  try {
    const data = await post('/predict', { features });
    if (typeof data.heart_risk !== 'number' || typeof data.stroke_risk !== 'number') {
      throw new Error('Reply was missing heart_risk or stroke_risk.');
    }
    return { ...data, source: 'live' };
  } catch (err) {
    await wait(700); // let the loading screen breathe
    return { ...mockPredict(features), source: 'mock', reason: err.message };
  }
}

async function counterfactual({ features, model, flip_field, flip_value }) {
  const payload = { features, model, flip_field, flip_value: Number(flip_value) };
  try {
    const data = await post('/counterfactual', payload);
    if (typeof data.new_risk !== 'number') throw new Error('Reply was missing new_risk.');
    return { ...data, source: 'live' };
  } catch {
    const key = model === 'heart' ? 'heart_risk' : 'stroke_risk';
    const original_risk = mockPredict(features)[key];
    const new_risk = mockPredict({ ...features, [flip_field]: Number(flip_value) })[key];
    return {
      original_risk,
      new_risk,
      delta: Number((new_risk - original_risk).toFixed(4)),
      source: 'mock',
    };
  }
}

          <path d="M-20 500 H120 l20 -30 l28 80 l36 -180 l32 160 l24 -60 h60 l30 -40 l28 70 h80 l30 -50 l28 80 l36 -180 l30 150 h120 l28 -40 l24 70 h80" />
          <path d="M-20 300 H80 l16 -20 l20 55 l26 -130 l22 110 l18 -45 h44 l22 -30 l20 50 h55 l22 -35 l20 55 l26 -130 l22 110 h88 l20 -28 l18 50 h620" transform="translate(0,100)" opacity="0.5"/>
        </svg>
        <blockquote>
          "Prevention is the best cure. Knowing your risk is where that starts."
          <cite>— MedFlowAI, CodeCortex Hackathon 2024</cite>
        </blockquote>
      </div>

      {/* right form */}
      <div className="login-form-side">
        <Mark />
        <h2>Welcome back</h2>
        <p className="sub">Sign in to your account to continue.</p>

        <form onSubmit={attempt} noValidate>
          <div className="login-fields">
            {err && <div className="login-err" role="alert">{err}</div>}

            <div className="field-wrap">
              <label htmlFor="lf-email">Email</label>
              <input
                id="lf-email"
                type="email"
                autoComplete="email"
                placeholder="doctor@medflowai.com"
                value={email}

            <div className="field-wrap">
              <label htmlFor="lf-pw">Password</label>

                  id="lf-pw"
                  type={showPw ? 'text' : 'password'}
                  autoComplete="current-password"
                  placeholder="••••••••"
                  value={password}
                  onChange={e => { setPassword(e.target.value); setErr(''); }}
                  aria-invalid={!!err}

                <button
                  type="button"

                    position: 'absolute', right: 14, top: '50%', transform: 'translateY(-50%)',

        <div className="login-divider">or</div>
        <button className="btn btn-guest" onClick={continueAsGuest}>
          Continue as guest

        <p className="login-footer">

          No account? <a href="#" onClick={e => { e.preventDefault(); onLogin('New User'); }}>Create one</a> — or just use guest mode above.
        </p>

  );
}

/* ============================ landing ============================ */

function Landing({ onStart, onSample }) {
  return (
    <div className="col">
      <svg className="hero-trace" viewBox="0 0 700 92" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 62 H150 l14 -6 l10 26 l16 -68 l17 60 l12 -18 h34 l13 -12 l11 22 h46 l16 -8 l12 22 l18 -66 l16 58 l13 -16 h38 l14 -10 l10 20 h122 l15 -7 l11 24 l17 -62 l15 52 h55" />
      </svg>

      <h1>Twenty-one questions, one at a time, and a number you can act on.</h1>

      <p className="lede">
        MedFlowAI runs your answers through two neural networks — one trained on cardiac
        catheterisation records, one on stroke outcomes — and shows you which single change
        would move your risk the most.
      </p>

      <div className="actions">
        <button className="btn on-shell" onClick={onStart}>
          Start the questions
        </button>
        <button className="btn ghost on-shell" onClick={onSample}>
          Fill with a sample patient
        </button>
      </div>

      <div className="facts">
        <div className="fact">
          <b>96.1%</b>
          <span>Heart model test accuracy</span>
        </div>
        <div className="fact">
          <b>80%</b>
          <span>Stroke recall, imbalance corrected</span>
        </div>
        <div className="fact">
          <b>~2 min</b>
          <span>Typical time to finish</span>
        </div>
      </div>

      <p className="disclaimer">
        This is a hackathon prototype, not a diagnosis. The models were trained on public
        datasets of a few thousand patients each and know nothing about your history beyond
        what you type here. Take the result to a clinician rather than acting on it alone.
      </p>
    </div>
  );
}

/* ============================ question ============================ */

function ChoiceInput({ q, value, onPick }) {
  return (
    <div className="opts" role="group" aria-label={q.prompt}>
      {q.options.map((o, i) => (
        <button
          key={String(o.value)}
          type="button"
          className="opt"
          aria-pressed={value === o.value}
          onClick={() => onPick(o.value)}
        >
          <span className="opt-key">{i + 1}</span>
          <span>
            <span className="opt-label">{o.label}</span>
            {o.note && <span className="opt-note">{o.note}</span>}
          </span>
        </button>
      ))}
    </div>
  );
}

function NumberInput({ q, value, onChange, onEnter, inputRef }) {
  return (
    <div className="numwrap">
      <input
        ref={inputRef}
        type="number"
        inputMode="decimal"
        value={value ?? ''}
        min={q.min}
        max={q.max}
        step={q.step}
        placeholder={q.placeholder}
        aria-label={q.prompt}
        onChange={(e) => onChange(e.target.value === '' ? undefined : Number(e.target.value))}
        onKeyDown={(e) => e.key === 'Enter' && onEnter()}
      />
      {q.unit && <span>{q.unit}</span>}
    </div>
  );
}

function SelectInput({ q, value, onChange }) {
  return (
    <select
      className="field"
      value={value ?? ''}
      aria-label={q.prompt}
      onChange={(e) => onChange(e.target.value || undefined)}
    >
      <option value="" disabled>
        Choose one
      </option>
      {q.options.map((o) => (
        <option key={o.value} value={o.value}>
          {o.label}
        </option>
      ))}
    </select>
  );
}

function QuestionScreen({ index, answers, setAnswer, onNext, onBack }) {
  const q = QUESTIONS[index];
  const value = answers[q.id];
  const [touched, setTouched] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => {
    setTouched(false);
    if (q.type === 'number' && inputRef.current) inputRef.current.focus();
  }, [index, q.type]);

  const error = useMemo(() => {
    if (value === undefined || value === '') return 'Answer this to carry on.';
    if (q.type === 'number') {
      const n = Number(value);
      if (!Number.isFinite(n)) return 'Enter a number.';
      if (n < q.min || n > q.max) return `Enter a value between ${q.min} and ${q.max}.`;
    }
    return null;
  }, [value, q]);

  const advance = useCallback(() => {
    if (error) {
      setTouched(true);
      return;
    }
    onNext();
  }, [error, onNext]);

  /* number-key shortcuts for choice questions */
  useEffect(() => {
    if (q.type !== 'choice') return;
    const onKey = (e) => {
      const n = Number(e.key);
      if (n >= 1 && n <= q.options.length) {
        setAnswer(q.id, q.options[n - 1].value);
      } else if (e.key === 'Enter' && value !== undefined) {
        onNext();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [q, value, setAnswer, onNext]);

  const section = SECTIONS[q.section];
  const tone = TONE[section.tone];
  const progress = ((index + 1) / QUESTIONS.length) * 100;

  return (
    <div className="col">
      <div className="card">
        <div className="rail">
          <div className="rail-track">
            <div className="rail-fill" style={{ width: `${progress}%`, background: tone }} />
          </div>
          <span className="rail-meta">
            {index + 1} of {QUESTIONS.length}
          </span>
        </div>

        <span className="section-tag" style={{ color: tone }}>
          <i className="dot" />
          {section.label}
        </span>

        <h2 className="prompt">{q.prompt}</h2>
        {q.help && <p className="help">{q.help}</p>}

        {q.type === 'choice' && (
          <ChoiceInput q={q} value={value} onPick={(v) => setAnswer(q.id, v)} />
        )}
        {q.type === 'number' && (
          <NumberInput
            q={q}
            value={value}
            inputRef={inputRef}
            onChange={(v) => setAnswer(q.id, v)}
            onEnter={advance}
          />
        )}
        {q.type === 'select' && (
          <SelectInput q={q} value={value} onChange={(v) => setAnswer(q.id, v)} />
        )}

        {touched && error && <p className="field-error">{error}</p>}

        <div className="actions">
          <button className="btn" onClick={advance} disabled={!!error && touched}>
            {index === QUESTIONS.length - 1 ? 'See my result' : 'Next'}
          </button>
          <button className="btn ghost" onClick={onBack}>
            Back
          </button>
          {q.type === 'choice' && <span className="hint">Press 1–{q.options.length} to pick</span>}
        </div>
      </div>
    </div>
  );
}

/* ============================ loading ============================ */

function LoadingScreen() {
  const lines = [
    'Standardising your 27 features',
    'Running the cardiac network',
    'Running the stroke network',
    'Working out what moved the number',
  ];
  const [i, setI] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setI((v) => (v + 1) % lines.length), 900);
    return () => clearInterval(t);
  }, []);
  return (
    <div className="col loading">
      <svg className="ekg" viewBox="0 0 220 60" aria-hidden="true">
        <path d="M0 34 H58 l8 -4 l6 16 l10 -42 l10 36 l7 -10 h18 l8 -6 l7 14 h88" />
      </svg>
      <h2>Reading your answers</h2>
      <p aria-live="polite">{lines[i]}</p>
    </div>
  );
}

/* ============================ results ============================ */

function ScoreCard({ name, risk, tier, drivers }) {
  return (
    <section className="score">
      <div className="score-top">
        <span className="score-name">{name}</span>
        <span className="score-tier" style={{ color: tier.color }}>
          {tier.label}
        </span>
      </div>
      <div className="score-num" style={{ color: tier.color }}>
        {pct(risk)}
      </div>
      <div className="meter">
        <i style={{ width: `${Math.max(risk * 100, 2)}%`, background: tier.color }} />
      </div>
      <ul className="drivers">
        {drivers.map((d) => (
          <li key={d}>{d}</li>
        ))}
      </ul>
    </section>
  );
}

function Results({ features, result, onExplore, onRestart, error }) {
  const ex = explain(features, result.heart_risk, result.stroke_risk);
  const steps = nextSteps(features, result.heart_risk, result.stroke_risk);
  const tier = overallTier(result.heart_risk, result.stroke_risk);

  const headline =
    tier.key === 'high'
      ? 'Both numbers are worth a conversation with a doctor soon.'
      : tier.key === 'moderate'
      ? 'Nothing urgent, but there is room to move these numbers down.'
      : 'Your answers put you in the low band on both models.';

  return (
    <div className="col wide">
      <div className="card">
        {error && <div className="err">{error}</div>}

        <div className="result-head">
          <span className="tier-mark" style={{ background: tier.color }}>
            {tier.label} risk
          </span>
          <h2>{headline}</h2>
        </div>

        <div className="scores">
          <ScoreCard name="Heart disease" risk={ex.heart.risk} tier={ex.heart.tier} drivers={ex.heart.drivers} />
          <ScoreCard name="Stroke" risk={ex.stroke.risk} tier={ex.stroke.tier} drivers={ex.stroke.drivers} />
        </div>

        <div className="steps">
          <h3>What to do next</h3>
          <ol>
            {steps.map((s) => (
              <li key={s}>{s}</li>
            ))}
          </ol>
        </div>

        <details className="payload">
          <summary>See the exact payload sent to /predict</summary>
          <pre>{JSON.stringify({ features }, null, 2)}</pre>
        </details>

        <div className="actions">
          <button className="btn" onClick={onExplore}>
            Try changing one thing
          </button>
          <button className="btn ghost" onClick={onRestart}>
            Start over
          </button>
        </div>

        {result.source === 'mock' && (
          <p className="mock-note">
            These numbers came from the built-in demo model because {API_BASE} did not answer.
            Start the C++ server and reload to see real inference.
          </p>
        )}
      </div>
    </div>
  );
}

/* ============================ counterfactual ============================ */

function Counterfactual({ features, baseline, onBack }) {
  const [lever, setLever] = useState(LEVERS[0]);
  const [value, setValue] = useState(() => Number(features[LEVERS[0].field]) || LEVERS[0].min);
  const [cf, setCf] = useState(null);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    setValue(Number(features[lever.field]) || lever.min);
    setCf(null);
  }, [lever, features]);

  useEffect(() => {
    let cancelled = false;
    setBusy(true);
    const t = setTimeout(async () => {
      const res = await counterfactual({
        features,
        model: lever.model,
        flip_field: lever.field,
        flip_value: value,
      });
      if (!cancelled) {
        setCf(res);
        setBusy(false);
      }
    }, 220);
    return () => {
      cancelled = true;
      clearTimeout(t);
    };
  }, [value, lever, features]);

  const original = cf ? cf.original_risk : baseline[lever.model === 'heart' ? 'heart_risk' : 'stroke_risk'];
  const updated = cf ? cf.new_risk : original;
  const delta = updated - original;
  const startValue = Number(features[lever.field]);
  const moved = Math.abs(value - startValue) > 1e-9;

  const sentence = !moved
    ? `Drag the slider to see what happens to your ${lever.model} risk.`
    : delta < -0.005
    ? `Dropping ${lever.label.toLowerCase()} to ${value}${lever.unit ? ' ' + lever.unit : ''} takes your ${lever.model} risk down by ${(Math.abs(delta) * 100).toFixed(1)} points.`
    : delta > 0.005
    ? `Moving ${lever.label.toLowerCase()} to ${value}${lever.unit ? ' ' + lever.unit : ''} pushes your ${lever.model} risk up by ${(delta * 100).toFixed(1)} points.`
    : `Changing ${lever.label.toLowerCase()} on its own barely shifts this model.`;

  return (
    <div className="col wide">
      <div className="card">
        <h2 className="prompt">What if one thing were different?</h2>
        <p className="help">
          Pick a factor, move the slider, and the server re-runs the same model with that one
          field replaced. Everything else stays exactly as you answered it.
        </p>

        <div className="lever-pick" role="group" aria-label="Factor to change">
          {LEVERS.map((l) => (
            <button
              key={l.field}
              type="button"
              className="chip"
              aria-pressed={lever.field === l.field}
              onClick={() => setLever(l)}
            >
              {l.label}
            </button>
          ))}
        </div>

        <div className="slider-row">
          <span className="slider-val">
            {value}
            {lever.unit && <span>{lever.unit}</span>}
          </span>
          <span className="hint">
            you answered {startValue}
            {lever.unit ? ` ${lever.unit}` : ''}
          </span>
        </div>

        <input
          type="range"
          min={lever.min}
          max={lever.max}
          step={lever.step}
          value={value}
          aria-label={lever.label}
          onChange={(e) => setValue(Number(e.target.value))}
        />

        <div className="cf-compare">
          <div className="cf-side">
            <small>Your answer</small>
            <b style={{ color: tierFor(original).color }}>{pct(original)}</b>
          </div>
          <div className="cf-arrow" aria-hidden="true">
            →
          </div>
          <div className="cf-side">
            <small>With the change</small>
            <b style={{ color: tierFor(updated).color, opacity: busy ? 0.45 : 1 }}>{pct(updated)}</b>
          </div>
        </div>

        <p className="cf-delta" aria-live="polite">
          {sentence}
        </p>

        <div className="actions">
          <button className="btn ghost" onClick={onBack}>
            Back to my result
          </button>
        </div>

        {cf && cf.source === 'mock' && (
          <p className="mock-note">
            Demo model — /counterfactual on {API_BASE} did not answer.
          </p>
        )}
      </div>
    </div>
  );
}

/* ============================ app ============================ */

function App() {
  const [user, setUser]         = useState(null); // null = not logged in
  const [screen, setScreen]     = useState('landing');
  const [index, setIndex]       = useState(0);
  const [answers, setAnswers]   = useState({});
  const [result, setResult]     = useState(null);
  const [features, setFeatures] = useState(null);
  const [error, setError]       = useState(null);

  const handleLogin = (name) => {
    setUser(name);
    setScreen('landing');
  };

  const handleSignOut = () => {
    setUser(null);
    setAnswers({});
    setIndex(0);
    setResult(null);
    setFeatures(null);
    setError(null);
    setScreen('landing');
  };

  // Gate every screen behind login
  if (!user) return <Login onLogin={handleLogin} />;

  const setAnswer = (id, value) =>
    setAnswers((prev) => ({ ...prev, [id]: value }));

  const submit = async (finalAnswers) => {
    setScreen('loading');
    setError(null);
    let payload;
    try {
      payload = assertValidFeatures(encodeFeatures(finalAnswers));
    } catch (e) {
      setError(e.message);
      setScreen('form');
      return;
    }
    setFeatures(payload);
    const res = await predict(payload);
    setResult(res);
    setError(
      res.source === 'mock' && res.reason
        ? `Could not reach the inference server (${res.reason}) — showing demo numbers.`
        : null
    );
    setScreen('results');
  };

  const next = () => {
    if (index === QUESTIONS.length - 1) submit(answers);
    else setIndex((i) => i + 1);
  };

  const back = () => {
    if (index === 0) setScreen('landing');
    else setIndex((i) => i - 1);
  };

  const restart = () => {
    setAnswers({});
    setIndex(0);
    setResult(null);
    setFeatures(null);
    setError(null);
    setScreen('landing');
  };

  if (screen === 'landing')
    return (
      <Shell user={user} onSignOut={handleSignOut}>
        <Landing
          onStart={() => { setIndex(0); setScreen('form'); }}
          onSample={() => { setAnswers(SAMPLE_ANSWERS); submit(SAMPLE_ANSWERS); }}
        />
      </Shell>
    );

  if (screen === 'form')
    return (
      <Shell user={user} onSignOut={handleSignOut}>
        <QuestionScreen
          index={index}
          answers={answers}
          setAnswer={setAnswer}
          onNext={next}
          onBack={back}
        />
      </Shell>
    );

  if (screen === 'loading')
    return (
      <Shell user={user} onSignOut={handleSignOut}>
        <LoadingScreen />
      </Shell>
    );

  if (screen === 'results')
    return (
      <Shell source={result?.source} user={user} onSignOut={handleSignOut}>
        <Results
          features={features}
          result={result}
          error={error}
          onExplore={() => setScreen('cf')}
          onRestart={restart}
        />
      </Shell>
    );

  return (
    <Shell source={result?.source} user={user} onSignOut={handleSignOut}>
      <Counterfactual features={features} baseline={result} onBack={() => setScreen('results')} />
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
